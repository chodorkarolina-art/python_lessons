{% extends "base.html" %}

{% block title %}Lista użytkowników{% endblock %}

{% block content %}

<!-- lesson24_task10 -->
<h1>Lista użytkowników</h1>

<ul>
    {% for user in users %}
        <li>
            {{ user.username }} ({{ user.email }})
        </li>
    {% empty %}
        <li>Brak użytkowników.</li>
    {% endfor %}
</ul>

{% endblock %}
