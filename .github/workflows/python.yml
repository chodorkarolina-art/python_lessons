# lesson38_task2

name: Python Workflow

# lesson38_task8
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest

    # lesson38_task6
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      # lesson38_task2
      - name: Checkout repository
        uses: actions/checkout@v4

      # lesson38_task2 + lesson38_task6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # lesson38_task5
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # lesson38_task3
      - name: Install dependencies
        run: pip install -r lesson38/requirements.txt

      # lesson38_task7
      - name: Run flake8
        run: flake8 lesson38/src/

      # lesson38_task4
      - name: Run tests
        run: python -m pytest lesson38/tests/test_math.py

      # lesson38_task2
      - name: Run Python file
        run: python lesson38/src/hello.py